<!doctype html>
<html lang="en" data-framework="javascript">

<head>
  <title>Cimbar Decoder</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <link rel="manifest" href="pwa-recv.json">
  <script>
    /* 自清理：注销所有旧 Service Worker 并清空缓存，避免残留 SW 提供损坏的 wasm
       导致解码页无法初始化（此前 cache-first SW 缓存了坏响应，wasm 加载失败、
       onRuntimeInitialized 不触发、摄像头权限弹窗不出现）。 */
    (function () {
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    })();
  </script>
</head>

<body>

  <style media="not all" data-legacy="official">
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100vh;
    }

    body {
      background-color: white;
      background-image: linear-gradient(135deg, rgb(0, 0, 0) 65px, transparent 130px),
        repeating-linear-gradient(135deg, rgb(0, 0, 0) 0px, rgb(153, 197, 206) 1px, transparent 1px, transparent 30px),
        repeating-linear-gradient(45deg, rgb(0, 0, 0) 0px, rgb(153, 197, 206) 1px, transparent 1px, transparent 30px);
      background-size: cover;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: black;
        color: white;
      }
    }

    #container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -100;
      overflow: hidden;
      /* Hide scrollbars */
    }

    video {
      height: 100%;
      width: 100%;
      z-index: -100;
      background-size: cover;
      transition: 1s opacity;
    }

    .statusbox {
      color: white;
      text-shadow: 1px 1px 1px green;
    }

    #progress_bars {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      margin-bottom: 1vh;
    }

    .progress {
      display: block;
      height: 1.2vh;
      margin-bottom: 1vh;
      background-color: white;
      border-top: 0.2vh inset navy;
      border-bottom: 0.4vh inset navy;
      border-right: 0.3vh inset navy;
      border-radius: 0 0.5vh 0.5vh 0;
      max-width: 100%;
      width: 0;
    }

    .crosshairs {
      border-color: white !important;
    }

    .crosshairs.scanning_xhairs {
      border-color: #FFFF00 !important;
    }

    .crosshairs.active_xhairs {
      border-color: #00FF00 !important;
    }

    #crosshair1 {
      position: fixed;
      top: 15%;
      right: 20%;
      width: 5%;
      height: 5%;
      z-index: -50;
      border-right: 5px groove;
      border-top: 5px groove;
      box-shadow: inset 0 0 0 4px #555,
    }

    #crosshair2 {
      position: fixed;
      bottom: 20%;
      left: 15%;
      width: 5%;
      height: 5%;
      z-index: -50;
      border-left: 5px groove;
      border-bottom: 5px groove;
      box-shadow: inset 0 0 0 4px #555,
    }

    #nav-container:focus-within {
      z-index: 1;
    }

    #nav-content,
    #nav-container .bg,
    #nav-container:focus-within #nav-button {
      z-index: 1;
    }

    /* options */
    #nav-container a.mode-auto,
    #nav-container a.mode-b {
      color: #555;
    }

    #nav-container.mode-auto a.mode-auto,
    #nav-container.mode-b a.mode-b {
      color: #9fa6b2;
    }

    /* nav stuff */
    /* built off of https://codepen.io/dannievinther/pen/NvZjvz */
    #nav-container {
      position: fixed;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #nav-container .bg {
      pointer-events: auto;
      position: absolute;
      left: 0;
      width: 100%;
      height: 100%;
      visibility: hidden;
      opacity: 0;
      transition: .3s;
      background: black;
    }

    #nav-container:focus-within .bg {
      visibility: visible;
      opacity: .6;
    }

    #nav-container * {
      visibility: visible;
    }

    #nav-button {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 60px;
      width: 30px;
      margin-left: 15px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      border: 0;
      outline: 0;
      background-image: linear-gradient(180deg, rgb(0, 0, 0, 0) 10%, rgb(0, 0, 0) 40%, rgb(0, 0, 0) 60%, rgb(0, 0, 0, 0) 90%);
      background-color: initial;
    }

    #nav-button.hide {
      opacity: 0;
      transition: .3s;
    }

    #nav-container:focus-within #nav-button.hide {
      opacity: 1;
    }

    .icon-bar {
      display: block;
      width: 100%;
      height: 3px;
      transition: .3s;
    }

    .icon-bar+.icon-bar {
      margin-top: 3px;
    }

    #nav-container .icon-bar:nth-of-type(1) {
      background-color: #00ff00;
      box-shadow: 0px 0px 5px #00ff00, 0px 0px 2px #00ff00;
    }

    #nav-container .icon-bar:nth-of-type(2) {
      background-color: #ffff00;
      box-shadow: 0px 0px 5px #ffff00, 0px 0px 2px #ffff00;
    }

    #nav-container .icon-bar:nth-of-type(3) {
      background-color: #00ffff;
      box-shadow: 0px 0px 5px #00ffff, 0px 0px 2px #00ffff;
    }

    #nav-container .icon-bar:nth-of-type(4) {
      background-color: #ff00ff;
      box-shadow: 0px 0px 5px #ff00ff, 0px 0px 2px #ff00ff;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(1) {
      background-color: #00ffff;
      box-shadow: 0px 0px 5px #00ffff, 0px 0px 2px #00ffff;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(2) {
      background-color: #ffff00;
      box-shadow: 0px 0px 5px #ffff00, 0px 0px 2px #ffff00;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(3) {
      background-color: #00ff00;
      box-shadow: 0px 0px 5px #00ff00, 0px 0px 2px #00ff00;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(4) {
      background-color: #ff00ff;
      box-shadow: 0px 0px 5px #ff00ff, 0px 0px 2px #ff00ff;
    }

    #nav-container:focus-within #nav-button {
      pointer-events: none;
    }

    #nav-container:focus-within .icon-bar {
      background-color: #aaa;
      background-image: none !important;
      box-shadow: none !important;
    }

    #nav-button.attention:focus-within .icon-bar {
      background-color: #00ffff;
    }

    #nav-container:focus-within .icon-bar:nth-of-type(1) {
      transform: translate3d(0, 9px, 0) rotate(45deg);
    }

    #nav-container:focus-within .icon-bar:nth-of-type(2),
    #nav-container:focus-within .icon-bar:nth-of-type(3) {
      opacity: 0;
    }

    #nav-container:focus-within .icon-bar:nth-of-type(4) {
      transform: translate3d(0, -9px, 0) rotate(-45deg);
    }

    #nav-content {
      margin-top: 60px;
      padding: 20px;
      position: absolute;
      top: 0;
      left: 0;
      height: calc(100% - 60px);
      overflow-x: clip;
      background-color: #282C34;
      text-align: center;
      pointer-events: auto;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      transform: translateX(-100%);
      transition: transform .3s;
    }

    #nav-content ul {
      height: calc(100% - 60px);
      display: flex;
      flex-direction: column;
      list-style: none;
    }

    #nav-content hr {
      border: 1px solid #444;
    }

    #nav-content li a {
      display: block;
      padding: 10px 5px;
      color: #9fa6b2;
      text-decoration: none;
      transition: color .1s;
    }

    #nav-content li a.attention {
      animation: glowing 1.5s infinite alternate;
    }

    #nav-content li a {
      font-variant: small-caps;
      font-size: 2em;
    }

    #nav-content h4 {
      color: gray;
      font-variant: small-caps;
      padding-top: 1em;
    }

    #nav-content li.modesel a {
      display: inline-block;
      width: 4em;
    }

    #nav-content li:hover {
      background-color: #2c323c;
    }

    #nav-content li:not(.small)+.small {
      margin-top: auto;
    }

    #nav-content li.small {
      display: flex;
      align-self: center;
    }

    #nav-content li.small a {
      font-size: 1em;
    }

    #nav-container:focus-within #nav-content,
    #debug_menu:focus-within {
      transform: none;
    }

    #debug_menu {
      transform: translateX(100%);
      margin-top: 60px;
      right: 0;
      padding: 20px;
      position: absolute;
      top: 0;
      max-width: 95%;
      z-index: 2;
      transition: transform .3s;
      opacity: 95%;
      background-color: black;
    }

    .invisible {
      display: none;
    }

    @keyframes glowing {
      0% {
        color: #00ffff;
      }
    }
  </style>

  <style>
    /* ===== 解码端新版界面 (与编码端统一, redesign) ===== */
    :root {
      --bg: #0a0d13;
      --bg-glow: radial-gradient(1200px 600px at 70% -10%, rgba(62, 197, 255, .10), transparent 60%);
      --surface: #12161f;
      --border: rgba(255, 255, 255, .09);
      --border-strong: rgba(255, 255, 255, .16);
      --text: #e8ecf4;
      --text-dim: #9aa4b5;
      --text-faint: #667085;
      --accent: #3ec5ff;
      --accent-soft: rgba(62, 197, 255, .14);
      --danger: #ff6b6b;
      --radius-lg: 22px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, .6), 0 0 0 1px var(--border) inset;
      --shadow-md: 0 12px 32px -14px rgba(0, 0, 0, .55);
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      background-color: var(--bg);
      background-image: var(--bg-glow);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -100;
      overflow: hidden;
    }

    video {
      height: 100%;
      width: 100%;
      z-index: -100;
      background-size: cover;
      transition: 1s opacity;
    }

    /* 准星 */
    .crosshairs {
      border-color: white !important;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .35);
    }

    .crosshairs.scanning_xhairs {
      border-color: #FFD54A !important;
      box-shadow: inset 0 0 0 4px rgba(255, 213, 74, .35);
    }

    .crosshairs.active_xhairs {
      border-color: #4ade80 !important;
      box-shadow: inset 0 0 0 4px rgba(74, 222, 128, .35);
    }

    #crosshair1 {
      position: fixed;
      top: 15%;
      right: 20%;
      width: 5%;
      height: 5%;
      z-index: -50;
      border-right: 5px groove;
      border-top: 5px groove;
    }

    #crosshair2 {
      position: fixed;
      bottom: 20%;
      left: 15%;
      width: 5%;
      height: 5%;
      z-index: -50;
      border-left: 5px groove;
      border-bottom: 5px groove;
    }

    /* 导航容器与遮罩 */
    #nav-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    #nav-container .bg {
      pointer-events: auto;
      position: absolute;
      inset: 0;
      visibility: hidden;
      opacity: 0;
      transition: .25s var(--ease);
      background: rgba(5, 8, 14, .6);
    }

    #nav-container:focus-within .bg {
      visibility: visible;
      opacity: 1;
    }

    #nav-container * {
      visibility: visible;
    }

    /* 汉堡菜单按钮（左上角） */
    #nav-button {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 52px;
      height: 52px;
      margin-left: 16px;
      padding: 14px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow-md);
      transition: border-color .2s var(--ease), transform .2s var(--ease), opacity .3s var(--ease);
    }

    #nav-button:hover {
      border-color: var(--border-strong);
    }

    #nav-button:active {
      transform: scale(.94);
    }

    #nav-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #nav-button.hide {
      opacity: 0;
      transition: .3s;
    }

    #nav-container:focus-within #nav-button.hide {
      opacity: 1;
    }

    #nav-container:focus-within #nav-button {
      pointer-events: none;
    }

    .icon-bar {
      display: block;
      width: 100%;
      height: 2px;
      border-radius: 2px;
      background: var(--text);
      transition: .3s var(--ease);
    }

    #nav-button .icon-bar:nth-of-type(1) {
      width: 80%;
    }

    #nav-button .icon-bar:nth-of-type(2) {
      width: 100%;
    }

    #nav-button .icon-bar:nth-of-type(3) {
      width: 60%;
    }

    #nav-button .icon-bar:nth-of-type(4) {
      display: none;
    }

    #nav-container:focus-within .icon-bar {
      background: var(--accent);
    }

    #nav-container:focus-within .icon-bar:nth-of-type(1) {
      transform: translate3d(0, 7px, 0) rotate(45deg);
      width: 100%;
    }

    #nav-container:focus-within .icon-bar:nth-of-type(2) {
      opacity: 0;
    }

    #nav-container:focus-within .icon-bar:nth-of-type(3) {
      transform: translate3d(0, -7px, 0) rotate(-45deg);
      width: 100%;
    }

    #nav-button.attention:focus-within .icon-bar {
      background: var(--accent);
    }

    /* 滑出面板 */
    #nav-content {
      padding: 88px 20px 24px;
      position: absolute;
      top: 0;
      left: 0;
      width: min(320px, 86vw);
      height: 100%;
      overflow-x: clip;
      overflow-y: auto;
      background: var(--surface);
      border-right: 1px solid var(--border);
      border-radius: 0 20px 20px 0;
      text-align: center;
      pointer-events: auto;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      transform: translateX(-100%);
      transition: transform .3s var(--ease);
      box-shadow: 24px 0 48px -20px rgba(0, 0, 0, .5);
      z-index: 1;
    }

    #nav-container:focus-within #nav-content {
      transform: none;
    }

    #nav-content ul {
      height: 100%;
      display: flex;
      flex-direction: column;
      list-style: none;
    }

    #nav-content hr {
      border: 0;
      height: 1px;
      background: var(--border);
      margin: 10px 0;
    }

    #nav-content li {
      padding: 2px 0;
    }

    #nav-content li a {
      display: block;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      text-decoration: none;
      font-size: 1rem;
      transition: color .2s var(--ease), background .2s var(--ease);
    }

    #nav-content li a:hover {
      color: var(--text);
      background: var(--accent-soft);
    }

    #nav-content li a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    #nav-content li a.attention {
      color: var(--accent);
      font-weight: 600;
      animation: none;
    }

    #nav-content h4 {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 14px 0 6px;
      padding-top: 0;
    }

    #nav-content li.modesel {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      padding: 5px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    #nav-content li.modesel h4 {
      flex-basis: 100%;
    }

    #nav-content li.modesel a {
      flex: 1;
      padding: 8px 0;
      font-size: .95rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-dim);
      border-radius: var(--radius-sm);
      transition: color .2s var(--ease), background .2s var(--ease);
    }

    #nav-container.mode-auto a.mode-auto,
    #nav-container.mode-b a.mode-b {
      color: #06121a;
      background: var(--accent);
    }

    #nav-content li:not(.small)+.small {
      margin-top: auto;
    }

    #nav-content li.small {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #nav-content li.small a {
      font-size: .85rem;
      padding: 8px 10px;
      color: var(--text-faint);
    }

    #nav-content li.small a:hover {
      color: var(--accent);
      background: transparent;
    }

    /* 调试面板 */
    #nav-container:focus-within #debug_menu,
    #debug_menu:focus-within {
      transform: none;
    }

    #debug_menu {
      transform: translateX(100%);
      margin-top: 60px;
      right: 0;
      padding: 20px;
      position: absolute;
      top: 0;
      max-width: 95%;
      z-index: 2;
      transition: transform .3s var(--ease);
      background: var(--surface);
      border-left: 1px solid var(--border);
      border-radius: 20px 0 0 20px;
      box-shadow: -24px 0 48px -20px rgba(0, 0, 0, .5);
      text-align: left;
    }

    #debug-button {
      display: none;
    }

    .statusbox {
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      margin: 4px 0;
      text-shadow: none;
      word-break: break-all;
    }

    .invisible {
      display: none;
    }

    /* 底部进度条 */
    #progress_bars {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      margin-bottom: 1vh;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #progress_bars .progress {
      height: 6px;
      width: 0%;
      background: var(--accent);
      border-radius: 3px;
      box-shadow: 0 0 12px rgba(62, 197, 255, .5);
      transition: width .25s linear;
    }

    #progress_bars div:empty {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>

  <div id="container">
    <video id="video" autoplay="true" playsinline="true" muted="true">
    </video>
  </div>

  <div id="crosshair1" class="crosshairs"></div>
  <div id="crosshair2" class="crosshairs"></div>

  <div id="nav-container" class="mode-auto">
    <div class="bg" onclick="Recv.blurNav();"></div>
    <button id="nav-button" tabindex="0" onclick="Recv.clickNav();">
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
    </button>
    <div id="nav-content" tabindex="-1">
      <ul>
        <li class="modesel">
          <h4>Mode</h4>
          <a class="mode-auto" href="javascript:void(0)" onclick="Recv.setMode('Auto')">Auto</a>
          <a class="mode-b" id="mode-val" href="javascript:void(0)" onclick="Recv.setMode(this.textContent)">B</a>
        </li>
        <li class="small"><a href="javascript:void(0)" onclick="Recv.showDebug()">Debug</a></li>
        <li class="small"><a href="javascript:void(0)" onclick="Recv.toggleFullscreen()">Fullscreen</a></li>
        <li class="small"><a href="https://github.com/sz3/libcimbar">github</a></li>
        <li class="small"><a href="https://github.com/sz3/cfc/releases/latest">android app</a></li>
      </ul>
    </div>
    <div id="debug_menu">
      <button id="debug-button" onclick="Recv.showDebug();"></button>
      <div class="statusbox" id="errorbox"></div>
      <div class="statusbox" id="t0">hi0</div>
      <div class="statusbox" id="t1">hi1</div>
      <div class="statusbox" id="t2">hi2</div>
      <div class="statusbox" id="t3">hi3</div>
      <div class="statusbox" id="framesInFlight"></div>
      <div class="statusbox" id="tdec">2026-07-13T0523</div>
    </div>
  </div>

  <div id="progress_bars">
    <div class="progress"></div>
  </div>

  <script src="recv.js"></script>
  <script src="zstd.js"></script>

  <script type="text/javascript">
    Recv.init_ww(4);
    // 不再注册 Service Worker：解码页必须联网获取最新 wasm，
    // SW 缓存曾导致 wasm 加载失败（见 head 自清理脚本）。
    var video = document.querySelector('#video');

    var Module = {};
    Module.onRuntimeInitialized = () => {
      Recv.init_video(video);
    };
  </script>

  <script src="cimbar_js.js"></script>

</body>

</html>
